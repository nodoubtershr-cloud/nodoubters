name: Backfill seasons (one-time)

# Re-pulls every season's homers from MLB (adds pitcher IDs and venues to older rows, keeps
# existing clips), fills missing video from MLB (2019+) and Baseball Savant (all years), and
# joins Savant's park counts / No Doubter data (2016+). Run it by hand from the Actions tab.
# The first run takes a couple of hours; later runs are quick because most work is already done.

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Seasons to fill, space-separated (default: all)"
        default: "2026 2025 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fill missing clips season by season
        env:
          SAVANT_MAX: "10000"
          MAX_FILL_GAMES: "1500"
        run: |
          for y in ${{ github.event.inputs.years }}; do
            echo "=== $y ==="
            node scripts/update-season.mjs $y-03-01 $y-11-15 || echo "season $y failed, continuing"
            node scripts/fill-parks.mjs $y || echo "park data for $y failed, continuing"
            git add data/seasons
            git -c user.name=nodoubters-bot -c user.email=actions@users.noreply.github.com commit -m "Backfill clips: $y" || true
          done
      - name: Rebuild the all-seasons data and pages
        run: |
          node scripts/build-all.mjs
          node scripts/build-pages.mjs
      - name: Push
        run: |
          git config user.name "nodoubters-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data days players teams season hr sitemap.xml index.html
          git diff --cached --quiet || git commit -m "Backfill clips: rebuild"
          git pull --rebase && git push
