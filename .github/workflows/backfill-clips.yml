name: Backfill seasons (one-time)

# Re-pulls every season's homers from MLB (adds pitcher IDs and venues to older rows, keeps
# existing clips), fills missing video from MLB (2019+) and Baseball Savant (all years), and
# joins Savant's park counts / No Doubter data (2016+). Run it by hand from the Actions tab.
# Each season is pushed as soon as it finishes, so a failure late in the run loses nothing.
# The first run takes a couple of hours; later runs are quick because most work is already done.

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Seasons to fill, space-separated (default: all)"
        default: "2026 2025 2024 2023 2022 2021 2020 2019 2018 2017 2016"
      what:
        description: "all = re-pull plays + clips + park data · parks = Savant park data only (fast)"
        default: "all"

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fill season by season, pushing each one
        env:
          SAVANT_MAX: "10000"
          MAX_FILL_GAMES: "1500"
        run: |
          git config user.name "nodoubters-bot"
          git config user.email "actions@users.noreply.github.com"
          for y in ${{ github.event.inputs.years }}; do
            echo "=== $y ==="
            if [ "${{ github.event.inputs.what }}" != "parks" ]; then
              node scripts/update-season.mjs $y-03-01 $y-11-15 || echo "season $y: update failed, continuing"
            fi
            if [ "${{ github.event.inputs.what }}" = "parks" ]; then
              FULL=1 node scripts/fill-parks.mjs $y || echo "season $y: park data failed, continuing"   # re-check every batter
            else
              node scripts/fill-parks.mjs $y || echo "season $y: park data failed, continuing"
            fi
            git add data
            if ! git diff --cached --quiet; then
              git commit -m "Backfill: $y"
              # another job may have pushed meanwhile; replay our commit on top, keeping our generated files on any clash
              git pull --rebase -X theirs origin main || { git rebase --abort; git pull -X ours origin main; }
              git push
            fi
          done
      - name: Rebuild the all-seasons data and pages
        run: |
          node scripts/build-all.mjs
          node scripts/build-pages.mjs
          git add data days players teams season hr sitemap.xml index.html
          git diff --cached --quiet || git commit -m "Backfill: rebuild all-seasons data and pages"
          git pull --rebase -X theirs origin main || { git rebase --abort; git pull -X ours origin main; }
          git push
