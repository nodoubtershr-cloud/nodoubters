name: Update season data

on:
  schedule:
    - cron: "0 11 * * *"      # every day at 11:00 UTC (4am Pacific), after West Coast games post
  workflow_dispatch:          # also lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the last 3 days of home runs
        run: node scripts/update-season.mjs
      - name: Rebuild the all-seasons leaderboard and player histories
        run: node scripts/build-all.mjs
      - name: Rebuild the day / player / team pages and sitemap
        run: node scripts/build-pages.mjs
      - name: Commit if anything changed
        run: |
          git config user.name "nodoubters-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seasons data/all days players teams season sitemap.xml index.html
          git diff --cached --quiet || (git commit -m "Season data: $(date -u +%Y-%m-%d)" && git pull --rebase && git push)
