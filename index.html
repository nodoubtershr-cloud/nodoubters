<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1b2b">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>No Doubters — every MLB home run, one day at a time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0f1b2b;        /* ballpark at night */
    --night-2: #16253a;
    --grass: #2f6b3a;
    --grass-2: #3c8a4a;
    --chalk: #f2efe6;
    --chalk-dim: #b9b6ad;
    --dirt: #b9895a;
    --amber: #f5b342;        /* scoreboard bulbs */
    --line: rgba(242,239,230,.12);
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --body: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--night); color: var(--chalk); font-family: var(--body); }
  body { min-height: 100vh; }
  a { color: var(--amber); }
  button { font-family: inherit; }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(var(--night) 85%, rgba(15,27,43,0));
    padding: 20px 24px 12px;
  }
  .masthead { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
  .masthead h1 {
    margin: 0; font-family: var(--display); font-weight: 800; font-size: 44px;
    letter-spacing: .02em; text-transform: uppercase; line-height: 1;
  }
  .masthead h1 span { color: var(--amber); }
  .masthead h1 { white-space: nowrap; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
  .mark { width: 44px; height: 46px; flex: none; }
  .date-nav { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 14px; }
  .date-nav button, .date-nav input {
    background: var(--night-2); color: var(--chalk); border: 1px solid var(--line);
    border-radius: 6px; height: 34px; padding: 0 12px; font-family: var(--mono); font-size: 14px; cursor: pointer;
  }
  .date-nav input { color-scheme: dark; cursor: text; }
  .date-nav button:hover { border-color: var(--amber); }
  .mode { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .mode button { background: transparent; color: var(--chalk-dim); border: 0; height: 34px; padding: 0 14px; font-family: var(--display); font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; cursor: pointer; }
  .mode button[aria-pressed="true"] { background: var(--chalk); color: var(--night); }
  .rank { font-family: var(--mono); font-size: 13px; color: var(--chalk-dim); width: 34px; flex: none; text-align: right; }
  .rank.top { color: var(--amber); font-weight: 500; }
  .more { display: block; margin: 20px auto 0; background: transparent; color: var(--chalk); border: 1px solid var(--line); border-radius: 999px; height: 40px; padding: 0 22px; font-size: 14px; cursor: pointer; }
  .more:hover { border-color: var(--amber); }
  .summary { margin-left: auto; font-family: var(--mono); font-size: 13px; color: var(--chalk-dim); }
  .summary b { color: var(--chalk); font-weight: 500; }

  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .controls .label { font-family: var(--display); text-transform: uppercase; letter-spacing: .12em; font-size: 13px; color: var(--chalk-dim); margin-right: 4px; }
  .sort {
    background: transparent; color: var(--chalk-dim); border: 1px solid var(--line); border-radius: 999px;
    height: 32px; padding: 0 14px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .sort:hover { color: var(--chalk); }
  .sort[aria-pressed="true"] { background: var(--amber); color: var(--night); border-color: var(--amber); font-weight: 600; }
  .sort .dir { font-family: var(--mono); font-size: 11px; }
  .filter {
    margin-left: auto; background: var(--night-2); color: var(--chalk); border: 1px solid var(--line);
    border-radius: 999px; height: 32px; padding: 0 14px; font-size: 13px; min-width: 200px;
  }
  .filter::placeholder { color: var(--chalk-dim); }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  /* ---------- the distance scale (signature) ---------- */
  .scale {
    display: grid; grid-template-columns: 380px 1fr; gap: 16px; padding: 4px 24px 6px;
    font-family: var(--mono); font-size: 11px; color: var(--chalk-dim);
  }
  .scale .ticks { position: relative; height: 18px; margin-right: 96px; }
  .scale .tick { position: absolute; top: 0; transform: translateX(-50%); }
  .scale .tick::before { content: ""; display: block; width: 1px; height: 6px; background: var(--line); margin: 0 auto 2px; }

  /* ---------- list ---------- */
  main { padding: 0 24px 80px; }
  .hr {
    display: grid; grid-template-columns: 380px 1fr; gap: 16px; align-items: center;
    padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer;
  }
  .hr:hover .who { color: var(--amber); }
  .who-wrap { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .headshot {
    width: 44px; height: 44px; border-radius: 50%; background: var(--night-2); object-fit: cover; flex: none;
    border: 1px solid var(--line);
  }
  .who { font-family: var(--display); font-size: 24px; font-weight: 700; line-height: 1; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { font-family: var(--mono); font-size: 12px; color: var(--chalk-dim); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta b { color: var(--chalk); font-weight: 500; }
  .meta .live { color: var(--amber); }

  .track { position: relative; height: 44px; }
  .lane { position: absolute; left: 0; right: 96px; top: 0; bottom: 0; }
  .bar {
    position: absolute; left: 0; top: 14px; height: 16px; border-radius: 0 3px 3px 0;
    background: linear-gradient(90deg, var(--grass), var(--grass-2));
    transition: width .5s cubic-bezier(.2,.8,.2,1);
  }
  .bar.none { background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 12px); width: 100% !important; opacity: .5; }
  .ft {
    position: absolute; top: 9px; font-family: var(--mono); font-size: 15px; font-weight: 500; white-space: nowrap;
    transform: translateX(10px); transition: left .5s cubic-bezier(.2,.8,.2,1);
  }
  .ft small { font-size: 11px; color: var(--chalk-dim); margin-left: 8px; }
  .time { position: absolute; right: 0; top: 0; font-family: var(--mono); font-size: 12px; color: var(--chalk-dim); }
  .hr.nohl .time::after { content: "no clip yet"; margin-left: 10px; color: var(--dirt); }

  /* ---------- player ---------- */
  .player { display: none; padding: 4px 0 20px; grid-column: 1 / -1; }
  .player.open { display: block; }
  .player video { width: 100%; max-width: 960px; aspect-ratio: 16/9; background: #000; border-radius: 8px; display: block; }
  .player .caption { font-family: var(--mono); font-size: 12px; color: var(--chalk-dim); margin-top: 8px; display: flex; gap: 18px; flex-wrap: wrap; }
  .player .caption a { color: var(--chalk-dim); }
  .player .caption a:hover { color: var(--amber); }

  /* ---------- badges ---------- */
  .who-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .badge { flex: none; display: block; overflow: visible; }
  .badge .bt { font-family: var(--mono); font-size: 11px; font-weight: 500; text-anchor: middle; dominant-baseline: central; }
  .badge .bc { font-family: var(--display); font-size: 12.5px; font-weight: 800; letter-spacing: .8px; dominant-baseline: central; }
  .badge.count { animation: pulse 2.6s ease-in-out infinite; transform-origin: center; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }
  @media (prefers-reduced-motion: reduce) { .badge.count { animation: none; } }

  /* ---------- favorites ---------- */
  .fav { background: none; border: 0; color: var(--chalk-dim); font-size: 20px; line-height: 1; cursor: pointer; padding: 6px; margin: -6px 0 -6px -6px; flex: none; opacity: .55; }
  .fav:hover { opacity: 1; }
  .fav.on { color: var(--amber); opacity: 1; }
  .mine { background: transparent; color: var(--chalk-dim); border: 1px solid var(--line); border-radius: 999px; height: 32px; padding: 0 14px; font-size: 13px; cursor: pointer; }
  .mine[aria-pressed="true"] { background: var(--amber); color: var(--night); border-color: var(--amber); font-weight: 600; }
  .share { background: transparent; color: var(--chalk-dim); border: 1px solid var(--line); border-radius: 999px; height: 32px; padding: 0 14px; font-size: 13px; cursor: pointer; display: none; }
  .share:hover { color: var(--chalk); }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--chalk); color: var(--night); padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 20; }
  .toast.show { opacity: 1; }

  /* ---------- notice, support, footer ---------- */
  .notice { margin: 10px 24px 0; padding: 8px 12px; border: 1px solid var(--line); border-left: 3px solid var(--amber); border-radius: 6px; font-family: var(--mono); font-size: 12px; color: var(--chalk-dim); display: none; }
  .notice.show { display: block; }
  .notice b { color: var(--chalk); font-weight: 500; }
  .support { font-family: var(--mono); font-size: 13px; color: var(--chalk-dim); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; height: 32px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .support:hover { color: var(--amber); border-color: var(--amber); }
  footer { padding: 28px 24px 40px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 12px; color: var(--chalk-dim); line-height: 1.7; }
  footer a { color: var(--chalk-dim); }
  footer a:hover { color: var(--amber); }

  /* ---------- states ---------- */
  .state { padding: 60px 0; text-align: center; font-family: var(--display); font-size: 28px; color: var(--chalk-dim); }
  .state small { display: block; font-family: var(--body); font-size: 14px; margin-top: 8px; }
  .state.error { color: var(--dirt); }

  @media (max-width: 720px) {
    header { position: static; }
    .scale { display: none; }
    .hr { grid-template-columns: 1fr; gap: 6px; }
    .track { height: 36px; }
    .bar { top: 10px; }
    .ft { top: 5px; }
    .time { display: none; }
    .lane { right: 0; }
    .masthead h1 { font-size: 36px; }
    .filter { margin-left: 0; width: 100%; }
    .support span { display: none; }
    .rank { width: 24px; }
  }
  @media (prefers-reduced-motion: reduce) { .bar, .ft { transition: none; } }
</style>
</head>
<body>

<header>
  <div class="masthead">
    <a class="brand" href="./" aria-label="No Doubters home"><img class="mark" src="logo-mark.svg" alt="" width="44" height="46"><h1>No <span>Doubters</span></h1></a>
    <div class="mode" role="group" aria-label="View">
      <button id="mode-today" aria-pressed="true">Today</button>

<script>
// ============================================================
// Data layer — all official MLB endpoints, all CORS-enabled.
// ============================================================
const API = "https://statsapi.mlb.com/api";
const SCALE_MIN = 300, SCALE_MAX = 500;     // feet; the bar track spans this range

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${r.status} ${url}`);
  return r.json();
}

// Return every home run for a date (YYYY-MM-DD), each joined to its highlight clip.
async function fetchHomeRuns(dateStr) {
  const sched = await getJSON(`${API}/v1/schedule?sportId=1&date=${dateStr}`);
  const games = sched.dates?.[0]?.games ?? [];
  const perGame = await Promise.all(games.map(g => fetchGameHomeRuns(g).catch(e => { console.warn(g.gamePk, e); return []; })));
  return { games, homeRuns: perGame.flat() };
}

async function fetchGameHomeRuns(game) {
  const pk = game.gamePk;
  const state = game.status?.abstractGameState;           // Preview | Live | Final
  if (state === "Preview") return [];

  const [feed, content] = await Promise.all([
    getJSON(`${API}/v1.1/game/${pk}/feed/live`),
    getJSON(`${API}/v1/game/${pk}/content`).catch(() => null),
  ]);

  // Highlight items keyed by guid — the guid IS the play's playId.
  const clips = new Map();
  for (const item of content?.highlights?.highlights?.items ?? []) {
    if (item.guid) clips.set(item.guid, item);
  }

  const teams = feed.gameData.teams;
  const plays = feed.liveData.plays.allPlays ?? [];
  const out = [];

  for (const p of plays) {
    if (p.result?.eventType !== "home_run") continue;
    // The last play event carrying hitData is the ball in play.
    const bip = [...p.playEvents].reverse().find(e => e.hitData) ?? p.playEvents.at(-1);
    const hd = bip?.hitData ?? {};
    const isTop = p.about.halfInning === "top";
    const batTeam = isTop ? teams.away : teams.home;
    const pitchTeam = isTop ? teams.home : teams.away;
    const clip = clips.get(bip?.playId);
    const mp4 = clip?.playbacks?.find(x => x.name === "mp4Avc")?.url
             ?? clip?.playbacks?.find(x => /mp4/i.test(x.name))?.url ?? null;
    const poster = clip?.image?.cuts?.find(c => c.width >= 640)?.src ?? clip?.image?.cuts?.[0]?.src ?? null;

    out.push({
      gamePk: pk,
      playId: bip?.playId ?? null,
      batter: p.matchup.batter.fullName,
      batterId: p.matchup.batter.id,
      pitcher: p.matchup.pitcher.fullName,
      team: batTeam.name, teamAbbr: batTeam.abbreviation,
      against: pitchTeam.abbreviation,
      inning: p.about.inning, half: p.about.halfInning,
      rbi: p.result.rbi,
      distance: hd.totalDistance ?? null,
      ev: hd.launchSpeed ?? null,
      la: hd.launchAngle ?? null,
      // startTime = first pitch of the PA; endTime = when the play resolved (the swing is ~seconds before).
      time: p.about.endTime ?? p.about.startTime ?? null,
      description: p.result.description,
      title: clip?.title ?? null,
      mp4, poster,
      savant: bip?.playId ? `https://baseballsavant.mlb.com/sporty-videos?playId=${bip.playId}` : null,
      id: bip?.playId ?? null,
      date: game.officialDate ?? game.gameDate?.slice(0, 10) ?? null,
      live: state === "Live",
    });
  }
  return out;
}

function distBadge(ft) {
  if (ft == null || ft < 400) return "";
  const tier = ft >= 500 ? 500 : ft >= 475 ? 475 : ft >= 450 ? 450 : ft >= 425 ? 425 : 400;
  return DIST_BADGES[tier];
}
function countBadge(nth) { return nth >= 2 ? COUNT_BADGES[Math.min(nth, 5)] : ""; }
// Number each batter's homers within a game-day, in the order they were hit.
function tagNth(list) {
  for (const h of list) if (favs.has(String(h.batterId)) && favs.get(String(h.batterId)).startsWith("Player ")) { favs.set(String(h.batterId), h.batter); saveFavs(); }
  const groups = {};
  for (const h of list) (groups[`${h.date ?? ""}|${h.batterId}`] ||= []).push(h);
  for (const g of Object.values(groups)) g.sort((a, b) => (a.time ?? "").localeCompare(b.time ?? "")).forEach((h, i) => h.nth = i + 1);
  return list;
}

// ============================================================
// Favorites (stored in this browser; shareable via #mine=)
// ============================================================
const FAV_KEY = "nodoubters.favs";
let favs = new Map();
try { for (const [id, name] of JSON.parse(localStorage.getItem(FAV_KEY) || "[]")) favs.set(String(id), name); } catch {}
function saveFavs() { try { localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); } catch {} }
function toggleFav(id, name) { id = String(id); favs.has(id) ? favs.delete(id) : favs.set(id, name); saveFavs(); render(); }
function toast(msg) { const t = document.querySelector("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1800); }

// ============================================================
// UI
// ============================================================
const $ = s => document.querySelector(s);
const listEl = $("#list"), dateEl = $("#date"), filterEl = $("#filter"), summaryEl = $("#summary");
let data = { games: [], homeRuns: [] };
let mode = "today";                          // "today" | "season"
let season = null;                           // { season, updated, homeRuns } once loaded
const PAGE = 100; let shown = PAGE;
let mineOnly = false;
let pendingOpen = null;                      // playId to auto-expand after load (from #hr=)
let autoDate = true;                         // true until the visitor picks a date themselves
const noticeEl = document.querySelector("#notice");
let sortKey = "distance", sortDir = -1;    // -1 desc, 1 asc
let openId = null;

// MLB's "today" is the Pacific-time date: a 10pm West Coast homer still belongs to that day's slate.
function mlbToday() { return new Date().toLocaleDateString("en-CA", { timeZone: "America/Los_Angeles" }); }
function localISODate(d = new Date()) {
  const off = d.getTimezoneOffset() * 60000;
  return new Date(d - off).toISOString().slice(0, 10);
}
function shiftDate(days) {
  const d = new Date(dateEl.value + "T12:00:00");
  d.setDate(d.getDate() + days);
  dateEl.value = localISODate(d);
  autoDate = false; load();
}
function fmtDate(d) { return new Date(d + "T12:00:00").toLocaleDateString([], { month: "short", day: "numeric" }); }
function fmtTime(iso) {
  return iso ? new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "—";
}
function lastName(full) { return full.trim().split(" ").filter(w => !/^(jr\.?|sr\.?|ii|iii|iv)$/i.test(w)).at(-1); }
function pct(ft) { return Math.max(2, Math.min(100, (ft - SCALE_MIN) / (SCALE_MAX - SCALE_MIN) * 100)); }

const comparators = {
  distance: (a, b) => (a.distance ?? -1) - (b.distance ?? -1),
  time:     (a, b) => (a.time ?? "").localeCompare(b.time ?? ""),
  team:     (a, b) => a.team.localeCompare(b.team) || (a.time ?? "").localeCompare(b.time ?? ""),
  player:   (a, b) => lastName(a.batter).localeCompare(lastName(b.batter)) || a.batter.localeCompare(b.batter),
};

function render() {
  const q = filterEl.value.trim().toLowerCase();
  const isSeason = mode === "season";
  const source = isSeason ? (season?.homeRuns ?? []) : data.homeRuns;
  document.querySelector('.sort[data-key="time"] .lbl').textContent = isSeason ? "Date" : "Time hit";
  let rows = source.filter(h => !q || h.batter.toLowerCase().includes(q) || h.team.toLowerCase().includes(q) || h.teamAbbr.toLowerCase().includes(q));
  if (mineOnly) rows = rows.filter(h => favs.has(String(h.batterId)));
  document.querySelector("#mine").setAttribute("aria-pressed", mineOnly);
  document.querySelector("#share").style.display = favs.size ? "inline-block" : "none";
  rows.sort((a, b) => comparators[sortKey](a, b) * sortDir);
  // rank by distance regardless of the current sort, so #1 is always the longest
  const rank = new Map();
  if (isSeason) [...source].filter(h => h.distance != null).sort((a, b) => b.distance - a.distance).forEach((h, i) => rank.set(h.id ?? h.playId, i + 1));
  const total = rows.length;
  if (isSeason) rows = rows.slice(0, shown);

  // sort buttons
  document.querySelectorAll(".sort").forEach(b => {
    const on = b.dataset.key === sortKey;
    b.setAttribute("aria-pressed", on);
    b.querySelector(".dir").textContent = on ? (sortDir < 0 ? "▼" : "▲") : "";
  });

  const finals = data.games.filter(g => g.status?.abstractGameState === "Final").length;
  const live = data.games.filter(g => g.status?.abstractGameState === "Live").length;
  const withDist = source.filter(h => h.distance != null);
  const longest = withDist.length ? Math.max(...withDist.map(h => h.distance)) : null;
  if (isSeason) {
    const lead = Object.entries(source.reduce((m, h) => (m[h.batter] = (m[h.batter] || 0) + 1, m), {})).sort((a, b) => b[1] - a[1])[0];
    summaryEl.innerHTML = season
      ? `<b>${source.length}</b> HR this season${longest ? ` · longest <b>${longest} ft</b>` : ""}${lead ? ` · leader <b>${lead[0]}</b> (${lead[1]})` : ""}`
      : "";
  } else summaryEl.innerHTML = data.games.length
    ? `<b>${data.homeRuns.length}</b> HR · <b>${data.games.length}</b> games (${finals} final${live ? `, <b>${live} live</b>` : ""})${longest ? ` · longest <b>${longest} ft</b>` : ""}`
    : "";

  if (!rows.length && mineOnly) {
    listEl.innerHTML = favs.size
      ? `<div class="state">None of your players went deep${isSeason ? " this season" : " on this day"}<small>Turn off ★ Mine to see everyone.</small></div>`
      : `<div class="state">No starred players yet<small>Tap the ☆ next to any player to add them, then ★ Mine shows only their homers.</small></div>`;
    return;
  }
  if (!rows.length) {
    listEl.innerHTML = isSeason
      ? (season ? `<div class="state">No matches<small>Nothing this season matches "${filterEl.value}".</small></div>` : `<div class="state">Loading season…</div>`)
      : data.homeRuns.length
      ? `<div class="state">No matches<small>Nothing on this date matches "${filterEl.value}".</small></div>`
      : data.games.length
        ? `<div class="state">No home runs yet<small>${finals === data.games.length ? "Every game is final and nobody went deep." : "Games are still in progress or haven't started — hit ↻ to check again."}</small></div>`
        : `<div class="state">No games scheduled<small>Pick another date.</small></div>`;
    return;
  }

  listEl.innerHTML = rows.map(h => {
    const id = h.id ?? h.playId ?? `${h.gamePk}-${h.batterId}-${h.inning}`;
    const hasDist = h.distance != null;
    const r = rank.get(id);
    return `
      <article class="hr ${h.mp4 ? "" : "nohl"}" data-id="${id}" tabindex="0" aria-expanded="${openId === id}">
        <div class="who-wrap">
          ${isSeason ? `<div class="rank ${r && r <= 10 ? "top" : ""}">${r ? "#" + r : ""}</div>` : ""}
          <button class="fav ${favs.has(String(h.batterId)) ? "on" : ""}" data-fav="${h.batterId}" data-name="${h.batter.replace(/"/g, "&quot;")}" title="${favs.has(String(h.batterId)) ? "Remove from" : "Add to"} my players" aria-label="${favs.has(String(h.batterId)) ? "Remove" : "Add"} ${h.batter} ${favs.has(String(h.batterId)) ? "from" : "to"} my players">${favs.has(String(h.batterId)) ? "★" : "☆"}</button>
          <img class="headshot" alt="" loading="lazy"
               src="https://img.mlbstatic.com/mlb-photos/image/upload/w_88,q_auto:best/v1/people/${h.batterId}/headshot/67/current"
               onerror="this.style.visibility='hidden'">
          <div style="min-width:0">
            <div class="who-line"><div class="who">${h.batter}</div>${distBadge(h.distance)}${countBadge(h.nth)}</div>
            <div class="meta"><b>${h.teamAbbr}</b> vs ${h.against} · ${h.half === "top" ? "T" : "B"}${h.inning} · ${h.rbi}-run${h.live ? ' · <span class="live">LIVE</span>' : ""}</div>
          </div>
        </div>
        <div class="track">
          <div class="time">${isSeason ? fmtDate(h.date) : fmtTime(h.time)}</div>
          <div class="lane">
            <div class="bar ${hasDist ? "" : "none"}" style="width:${hasDist ? pct(h.distance) : 0}%"></div>
            <div class="ft" style="left:${hasDist ? pct(h.distance) : 0}%">
              ${hasDist ? `${h.distance} ft` : "no Statcast"}
              ${h.ev ? `<small>${h.ev} mph · ${h.la}°</small>` : ""}
            </div>
          </div>
        </div>
        <div class="player ${openId === id ? "open" : ""}">
          ${openId === id ? playerHTML(h) : ""}
        </div>
      </article>`;
  }).join("") + (isSeason && total > shown ? `<button class="more" id="more">Show ${Math.min(PAGE, total - shown)} more (${total - shown} remaining)</button>` : "");
}

// A clip can be missing because MLB is still publishing the game's highlights or one request failed.
// When someone opens such a row, re-ask MLB for that game's clips right then.
const retried = new Set();
async function retryClip(h) {
  const key = `${h.gamePk}:${h.id}`;
  if (retried.has(key) || !h.id) return;
  retried.add(key);
  try {
    const content = await getJSON(`${API}/v1/game/${h.gamePk}/content`);
    const clip = (content?.highlights?.highlights?.items ?? []).find(it => it.guid === h.id);
    if (!clip) return;
    h.mp4 = clip.playbacks?.find(x => x.name === "mp4Avc")?.url ?? clip.playbacks?.find(x => /mp4/i.test(x.name))?.url ?? null;
    h.poster = clip.image?.cuts?.find(c => c.width >= 640)?.src ?? null;
    h.title = clip.title ?? h.title;
    if (h.mp4) render();
  } catch {}
}
function playerHTML(h) {
  if (!h.savant && h.id && h.id.includes("-") && h.id.length > 30) h.savant = `https://baseballsavant.mlb.com/sporty-videos?playId=${h.id}`;
  if (!h.mp4) {
    retryClip(h);
    return `<div class="caption">Checking MLB for this clip… if it doesn't appear, MLB hasn't posted it yet.${h.savant ? ` <a href="${h.savant}" target="_blank" rel="noopener">Try Baseball Savant ↗</a>` : ""}</div>`;
  }
  return `
    <video controls autoplay playsinline preload="metadata" ${h.poster ? `poster="${h.poster}"` : ""} src="${h.mp4}"></video>
    <div class="caption">
      <span>${h.title ?? h.description}</span>
      <span>off ${h.pitcher}</span>
      <a href="${h.mp4}" target="_blank" rel="noopener">mp4 ↗</a>
      ${h.savant ? `<a href="${h.savant}" target="_blank" rel="noopener">Savant ↗</a>` : ""}
    </div>`;
}

function renderScale() {
  const ticks = [];
  for (let ft = SCALE_MIN; ft <= SCALE_MAX; ft += 50) ticks.push(`<span class="tick" style="left:${pct(ft)}%">${ft}</span>`);
  $("#ticks").innerHTML = ticks.join("");
}

async function load() {
  openId = null;
  listEl.innerHTML = `<div class="state">Loading ${dateEl.value}…</div>`;
  summaryEl.textContent = "";
  noticeEl.classList.remove("show");
  try {
    if (autoDate) dateEl.value = mlbToday();
    data = await fetchHomeRuns(dateEl.value);
    tagNth(data.homeRuns);
    // Nothing yet today (or an off day)? Show yesterday's board instead of an empty page.
    if (autoDate && data.homeRuns.length === 0) {
      const today = dateEl.value;
      const y = new Date(today + "T12:00:00"); y.setDate(y.getDate() - 1);
      dateEl.value = localISODate(y);
      data = await fetchHomeRuns(dateEl.value);
      tagNth(data.homeRuns);
      noticeEl.innerHTML = `No homers yet today — showing <b>${fmtDate(dateEl.value)}</b>. Hit ↻ to check again.`;
      noticeEl.classList.add("show");
    }
    render();
    if (pendingOpen) {
      const row = listEl.querySelector(`.hr[data-id="${pendingOpen}"]`);
      pendingOpen = null;
      if (row) { openId = row.dataset.id; render(); listEl.querySelector(`.hr[data-id="${openId}"]`)?.scrollIntoView({ block: "start", behavior: "smooth" }); }
    }
  } catch (e) {
    listEl.innerHTML = `<div class="state error">Couldn't reach MLB<small>${e.message}. Check your connection and hit ↻.</small></div>`;
  }
}

async function loadSeason() {
  if (season) return;
  try {
    const r = await fetch("data/season.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(`${r.status}`);
    season = await r.json();
    tagNth(season.homeRuns);
    render();
  } catch (e) {
    listEl.innerHTML = `<div class="state error">Couldn't load the season file<small>${e.message}. It should be at data/season.json.</small></div>`;
  }
}
function setMode(m) {
  mode = m; openId = null; shown = PAGE;
  document.querySelector("#mode-today").setAttribute("aria-pressed", m === "today");
  document.querySelector("#mode-season").setAttribute("aria-pressed", m === "season");
  document.querySelector(".date-nav").style.display = m === "season" ? "none" : "";
  history.replaceState(null, "", m === "season" ? "#season" : location.pathname);
  if (m === "season") { sortKey = "distance"; sortDir = -1; render(); loadSeason(); }
  else render();
}

// ---- wiring ----
document.querySelector("#mode-today").addEventListener("click", () => setMode("today"));
document.querySelector("#mode-season").addEventListener("click", () => setMode("season"));
renderScale();
dateEl.value = localISODate();
dateEl.addEventListener("change", () => { autoDate = false; load(); });
$("#prev").addEventListener("click", () => shiftDate(-1));
$("#next").addEventListener("click", () => shiftDate(1));
$("#refresh").addEventListener("click", load);
filterEl.addEventListener("input", () => { shown = PAGE; render(); });
document.querySelectorAll(".sort").forEach(b => b.addEventListener("click", () => {
  const key = b.dataset.key;
  if (key === sortKey) sortDir *= -1;
  else { sortKey = key; sortDir = key === "distance" ? -1 : 1; }
  render();
}));
listEl.addEventListener("click", e => {
  if (e.target.closest("a, video")) return;
  const fb = e.target.closest(".fav");
  if (fb) { toggleFav(fb.dataset.fav, fb.dataset.name); return; }
  if (e.target.id === "more") { shown += PAGE; render(); return; }
  const row = e.target.closest(".hr"); if (!row) return;
  openId = openId === row.dataset.id ? null : row.dataset.id;
  render();
  if (openId) row.scrollIntoView({ block: "nearest", behavior: "smooth" });
});
listEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.classList.contains("hr")) e.target.click();
});
document.querySelector("#mine").addEventListener("click", () => { mineOnly = !mineOnly; shown = PAGE; render(); });
document.querySelector("#share").addEventListener("click", async () => {
  const url = `${location.origin}${location.pathname}#mine=${[...favs.keys()].join(",")}`;
  try { await navigator.clipboard.writeText(url); toast("Link copied — open it on any device to import your players"); }
  catch { prompt("Copy this link:", url); }
});

// #season shows the leaderboard; #mine=ID,ID,… imports starred players (names fill in as they appear)
const hashParams = Object.fromEntries(location.hash.slice(1).split("&").filter(Boolean).map(kv => { const [k, v = "1"] = kv.split("="); return [k, v]; }));
if (hashParams.mine) {
  let added = 0;
  for (const id of hashParams.mine.split(",")) if (id && !favs.has(id)) { favs.set(id, favs.get(id) ?? `Player ${id}`); added++; }
  saveFavs(); if (added) { mineOnly = true; setTimeout(() => toast(`Imported ${added} player${added === 1 ? "" : "s"} to ★ Mine`), 300); }
}
if (/^\d{4}-\d{2}-\d{2}$/.test(hashParams.d ?? "")) { dateEl.value = hashParams.d; autoDate = false; }
if (hashParams.hr) pendingOpen = hashParams.hr;
load();
if (hashParams.season) setMode("season");
</script>
</body>
</html>
